# Investor OS configuration. No secrets here (see .env).
base_currency: CZK

portfolio:
  default_benchmark: SPY
  # Benchmarks tracked by `update-prices`. Symbols are provider symbols (Yahoo for v1).
  benchmarks:
    - symbol: SPY
      name: "S&P 500 (SPY ETF)"
      currency: USD
    - symbol: QQQ
      name: "Nasdaq-100 (QQQ ETF)"
      currency: USD

market_data:
  provider: yahoo
  # How far back to fetch history when an instrument has no cached prices
  default_history_start: "2015-01-01"

ibkr:
  flex_version: 3
  base_url: "https://ndcdyn.interactivebrokers.com/AccountManagement/FlexWebService"
  # Seconds to wait between GetStatement retries while the report is being generated
  poll_interval_seconds: 5
  max_poll_attempts: 12

dashboard:
  host: 127.0.0.1
  port: 8501

logging:
  path: logs/investor.log
  level: INFO

# ---- v3 intelligence layer ----
sec:
  # SEC requires a descriptive User-Agent with contact info. Override via SEC_USER_AGENT in .env.
  user_agent: "InvestorOS/3.0 (personal research; contact not-set@example.com)"
  rate_limit_seconds: 0.15
  material_forms: ["10-K", "10-Q", "8-K", "20-F", "6-K", "S-1", "DEF 14A", "F-1"]

ai:
  enabled: true            # the app is fully functional without AI
  provider: llama_cpp       # local OpenAI-compatible server (llama.cpp)
  base_url: "http://127.0.0.1:8080/v1"
  model: "local"
  timeout_seconds: 600
  temperature: 0.2

intelligence:
  macro_series:             # default tracked macro series (FRED, no API key required)
    - {code: FEDFUNDS,   name: "Federal Funds Rate",        unit: "%",     frequency: monthly}
    - {code: CPIAUCSL,   name: "US CPI (all items)",        unit: "index", frequency: monthly}
    - {code: CPILFESL,   name: "US Core CPI",               unit: "index", frequency: monthly}
    - {code: UNRATE,     name: "US Unemployment rate",      unit: "%",     frequency: monthly}
    - {code: GDPC1,      name: "US Real GDP",               unit: "bn",    frequency: quarterly}
    - {code: DGS10,      name: "10Y Treasury yield",        unit: "%",     frequency: daily}
    - {code: DGS2,       name: "2Y Treasury yield",         unit: "%",     frequency: daily}
    - {code: T10Y2Y,     name: "10Y-2Y Treasury spread",    unit: "%",     frequency: daily}
    - {code: DTWEXBGS,   name: "USD trade-weighted index",  unit: "index", frequency: daily}
    - {code: DEXBZUS,    name: "USD/BRL",                   unit: "BRL",   frequency: daily}
    - {code: DEXMXUS,    name: "USD/MXN",                   unit: "MXN",   frequency: daily}
    - {code: IRSTCB01BRM156N, name: "Brazil policy rate (Selic proxy)", unit: "%", frequency: monthly}
    - {code: BRACPIALLMINMEI, name: "Brazil CPI",           unit: "index", frequency: monthly}
    - {code: MEXCPIALLMINMEI, name: "Mexico CPI",           unit: "index", frequency: monthly}
    # Limitation: no reliable key-free FRED series found for Mexico policy rate and Brazil
    # unemployment (previous OECD codes were discontinued); add via another provider later.

# ---- v4 mentor & briefing ----
briefing:
  output_dir: output/briefs
  daily:
    price_move_pct: 5            # single-position price move worth surfacing
    portfolio_move_pct: 2        # whole-portfolio value move vs last brief
    portfolio_weight_change_pp: 1
    insider_min_value_usd: 100000
    macro_change_pct: 2          # change vs previous observation of a LINKED series
    valuation_band_pct: 10       # price within this % of a scenario target = threshold zone
    max_items: 10
  weekly:
    max_items: 25

# ---- v5 operations & mentor ----
# ai server helper (scripts/start_ai_server.ps1); bound to 127.0.0.1 only
#   server_executable: C:\llama-cuda\bin\llama-server.exe
#   server_model: <path or HF identifier of the GGUF model>
#   server_context: 16384

tts:
  enabled: false          # optional local Windows TTS (System.Speech) -> .wav next to the brief
  provider: windows_sapi
  rate: 0                 # -10 (slow) .. 10 (fast)

mentor:
  daily_target_minutes: 7
  weekly_target_minutes: 15
  show_technicals: true
  show_macro: true
  show_discovery: true
  teach_me: true          # "investment concept of the day" section
