valuation:
  models:
    - name: "2030 earnings multiple framework"
      model_type: PE
      reference_price: 13.65
      currency: USD
      notes: |
        Historical valuation framework from the original investment analysis.
        The company thesis was stronger than the valuation thesis at the time.
      scenarios:
        - scenario_name: BEAR
          probability: 20
          target_price: 11.0
          time_horizon_months: 48
          dividends: 0
          notes: |
            2030 net income approximately $4.8B, EPS around $1.00 and 11x exit P/E.

        - scenario_name: BASE
          probability: 50
          target_price: 27.1
          time_horizon_months: 48
          dividends: 0
          notes: |
            2030 net income approximately $8.1B, EPS around $1.69 and 16x exit P/E.

        - scenario_name: BULL
          probability: 30
          target_price: 54.3
          time_horizon_months: 48
          dividends: 0
          notes: |
            2030 net income approximately $11.8B, EPS around $2.47 and 22x exit P/E.

predictions:
  - statement: "NU maintains ROE substantially above traditional banking levels over the long term."
    probability: 75
    resolution_condition: "Evaluate across multiple future annual and quarterly reporting periods."
    notes: "Long-horizon qualitative prediction."

  - statement: "ARPAC continues to grow over the long term."
    probability: 80
    resolution_condition: "Evaluate from subsequent quarterly ARPAC observations."
    notes: "Should eventually be replaced by more precisely time-bounded predictions for calibration."

  - statement: "Mexico becomes an economically meaningful second market."
    probability: 65
    resolution_condition: |
      Evaluate from customer growth, monetization, engagement, lending economics
      and profitability development.
    notes: "Long-horizon prediction with relatively high uncertainty."

  - statement: "Credit losses do not erase the economic benefit of lending growth."
    probability: 70
    resolution_condition: |
      Evaluate using NPL formation, cost of risk and risk-adjusted profitability
      over multiple reporting periods.

  - statement: "Risk-adjusted profitability remains strong while the loan book scales."
    probability: 70
    resolution_condition: |
      Evaluate across future risk-adjusted NIM and loan portfolio observations.

decisions:
  - decision_type: BUY
    decided_at: "2026-08-19"
    reasoning: |
      Q2 results continued to support the long-term investment thesis through
      exceptionally high ROE, continued lending and monetization growth, strong
      risk-adjusted NIM, and continued Mexico expansion.

      Credit quality requires close monitoring because NPL 90+ increased, but the
      combination of improving 15–90 day NPL, lower cost of credit and stronger
      risk-adjusted NIM did not indicate a structural breakdown in lending economics.

      Valuation was not sufficiently cheap to justify immediate high concentration,
      so the initial position was deliberately kept relatively small with the option
      to add capital as fundamentals and price evolve.

    confidence: 75
    time_horizon: "5+ years"
    expected_outcome: |
      Long-term compounding driven by customer growth, increasing monetization,
      operating leverage and geographic expansion.

    what_would_make_this_wrong: |
      Structural deterioration in credit economics, loss of operating leverage,
      failure of Mexico monetization, structural ROE deterioration, or evidence
      that NU lacks a durable cost advantage.
