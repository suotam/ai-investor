    direction: SUPPORTING
    evidence_type: EARNINGS
    title: "Q2 2026 net income exceeded $1B"
    summary: |
      Net income reached approximately $1.061B, around 49% year-over-year growth
      on an FX-neutral basis.
    source_name: "NU Q2 2026 results"
    reliability: HIGH
    importance: HIGH

  - target_type: ASSUMPTION
    target_name: "NU maintains structurally high ROE"
    direction: SUPPORTING
    evidence_type: EARNINGS
    title: "Q2 2026 ROE reached 33%"
    summary: "ROE remained exceptionally high at approximately 33%."
    source_name: "NU Q2 2026 results"
    reliability: HIGH
    importance: HIGH

  - target_type: ASSUMPTION
    target_name: "Credit quality remains economically controlled"
    direction: SUPPORTING
    evidence_type: EARNINGS
    title: "Early delinquency improved"
    summary: "15–90 day NPL declined from approximately 5.0% to 4.8%."
    source_name: "NU Q2 2026 results"
    reliability: HIGH
    importance: HIGH

  - target_type: ASSUMPTION
    target_name: "Credit quality remains economically controlled"
    direction: CONTRADICTING
    evidence_type: EARNINGS
    title: "NPL 90+ increased"
    summary: "NPL 90+ increased from approximately 6.5% to 6.9%."
    source_name: "NU Q2 2026 results"
    reliability: HIGH
    importance: HIGH

  - target_type: ASSUMPTION
    target_name: "Credit quality remains economically controlled"
    direction: SUPPORTING
    evidence_type: EARNINGS
    title: "Risk-adjusted NIM improved"
    summary: "Risk-adjusted NIM improved to approximately 12.4%."
    source_name: "NU Q2 2026 results"
    reliability: HIGH
    importance: HIGH

  - target_type: ASSUMPTION
    target_name: "ARPAC continues to grow"
    direction: SUPPORTING
    evidence_type: EARNINGS
    title: "ARPAC reached approximately $17.1"
    summary: "Customer monetization remained strong."
    source_name: "NU Q2 2026 results"
    reliability: HIGH
    importance: HIGH

  - target_type: ASSUMPTION
    target_name: "Mexico becomes a meaningful second engine"
    direction: SUPPORTING
    evidence_type: EARNINGS
    title: "Mexico reached roughly 16 million customers"
    summary: |
      Mexico continued scaling rapidly and remains the most important geographic
      expansion opportunity after Brazil.
    source_name: "NU Q2 2026 results"
    reliability: HIGH
